name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly Monday-morning sweep so new advisories surface without a push.
    - cron: "0 6 * * 1"

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit locked dependencies
        # Audits the pinned lock by name and version against the PyPI and
        # OSV advisory databases. No package installation happens, so the
        # macOS-only wheels (pyobjc, mlx) audit fine from a Linux runner.
        run: pip-audit -r requirements-lock.txt --no-deps --disable-pip
